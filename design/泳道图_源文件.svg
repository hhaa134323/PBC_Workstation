<svg viewBox="0 0 680 560" width="680" height="560" role="img">
<title>PBC工作站审计员工作流程</title>
<desc>三泳道流程图：客户、工作站、审计员。展示从客户放文件到审计员确认归档、查看缺料、生成汇报的完整流程。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.lane-bg{fill:#F6F6FA;stroke:#C4C4CD;stroke-width:0.5}
.lane-cust{fill:#FAEEDA;stroke:#C4C4CD;stroke-width:0.5}
.lane-sys{fill:#E6F1FB;stroke:#C4C4CD;stroke-width:0.5}
.lane-aud{fill:#E1F5EE;stroke:#C4C4CD;stroke-width:0.5}
.lane-label{font-family:-apple-system,sans-serif;font-size:13px;font-weight:500;fill:#1A1A24;text-anchor:middle}
.lane-sub{font-family:-apple-system,sans-serif;font-size:11px;font-weight:400;fill:#71717a;text-anchor:middle}
.node-title{font-family:-apple-system,sans-serif;font-size:13px;font-weight:500;fill:#1A1A24;text-anchor:middle}
.node-sub{font-family:-apple-system,sans-serif;font-size:11px;font-weight:400;fill:#52525b;text-anchor:middle}
.arr{fill:none;stroke:#888780;stroke-width:1.5}
.arr-amber{fill:none;stroke:#BA7517;stroke-width:1.5}
.step-num{font-family:-apple-system,sans-serif;font-size:10px;font-weight:500;fill:#71717a;text-anchor:middle}
</style>
</defs>

<rect x="0" y="0" width="680" height="560" fill="transparent"/>

<rect x="30" y="20" width="170" height="520" rx="8" class="lane-cust"/>
<rect x="210" y="20" width="230" height="520" rx="8" class="lane-sys"/>
<rect x="455" y="20" width="195" height="520" rx="8" class="lane-aud"/>

<text x="115" y="42" class="lane-label">客户</text>
<text x="115" y="58" class="lane-sub">放文件，不学新工具</text>
<text x="325" y="42" class="lane-label">工作站</text>
<text x="325" y="58" class="lane-sub">扫描、匹配、归档、记录</text>
<text x="552" y="42" class="lane-label">审计员</text>
<text x="552" y="58" class="lane-sub">确认、判断、追溯</text>

<line x1="30" y1="70" x2="650" y2="70" stroke="#C4C4CD" stroke-width="0.5"/>

<g>
<rect x="50" y="85" width="130" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="115" y="100" class="node-title">放文件到共享文件夹</text>
<text x="115" y="116" class="node-sub">照常用，不用学</text>
<text x="115" y="80" class="step-num">1</text>
</g>

<path class="arr-amber" d="M180 107 L230 107" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="85" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="100" class="node-title">watchdog 监听 + 扫描</text>
<text x="325" y="116" class="node-sub">标记 pending，不处理</text>
<text x="325" y="80" class="step-num">2</text>
</g>

<path class="arr" d="M325 129 L325 155" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="155" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="170" class="node-title">AI 匹配 PBC 清单项</text>
<text x="325" y="186" class="node-sub">归档建议 + 置信度（可选）</text>
<text x="325" y="150" class="step-num">3</text>
</g>

<path class="arr" d="M420 177 L500 177" marker-end="url(#arrow)"/>

<g>
<rect x="465" y="155" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="170" class="node-title">逐条确认归档</text>
<text x="552" y="186" class="node-sub">预览 / 改分类 / 确认</text>
<text x="552" y="150" class="step-num">4</text>
</g>

<path class="arr" d="M552 199 L552 225" marker-end="url(#arrow)"/>

<g>
<rect x="465" y="225" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="240" class="node-title">看待初检缺料</text>
<text x="552" y="256" class="node-sub">超期项标红</text>
<text x="552" y="220" class="step-num">5</text>
</g>

<path class="arr" d="M552 269 L552 295" marker-end="url(#arrow)"/>

<g>
<rect x="465" y="295" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="310" class="node-title">看变更记录追溯</text>
<text x="552" y="326" class="node-sub">谁改了什么、什么时候</text>
<text x="552" y="290" class="step-num">6</text>
</g>

<path class="arr" d="M465 317 L420 317" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="295" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="310" class="node-title">SOP 命名归档</text>
<text x="325" y="326" class="node-sub">写变更记录 + 更新清单</text>
<text x="325" y="290" class="step-num">4a</text>
</g>

<path class="arr" d="M325 339 L325 365" marker-end="url(#arrow)"/>

<g>
<rect x="230" y="365" width="190" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="325" y="380" class="node-title">缺料检测</text>
<text x="325" y="396" class="node-sub">知识库兜底，不依赖 AI</text>
<text x="325" y="360" class="step-num">5a</text>
</g>

<path class="arr" d="M420 387 L465 387" marker-end="url(#arrow)"/>

<g>
<rect x="465" y="365" width="175" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="552" y="380" class="node-title">生成缺料汇报</text>
<text x="552" y="396" class="node-sub">粘到邮件发客户催料</text>
<text x="552" y="360" class="step-num">7</text>
</g>

<path class="arr-amber" d="M552 409 L465 435 L465 470" marker-end="url(#arrow)" fill="none"/>

<g>
<rect x="50" y="455" width="130" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="115" y="470" class="node-title">客户补料</text>
<text x="115" y="486" class="node-sub">回到步骤 1</text>
<text x="115" y="450" class="step-num">8</text>
</g>

<path class="arr-amber" d="M115 455 L115 129 L180 129" fill="none" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

<text x="325" y="530" class="node-sub" style="font-size:11px;fill:#9ca3af">AI 可选：关掉仍可手动分类归档，其余功能照常</text>

</svg>
