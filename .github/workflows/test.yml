name: PBC 工作站 CI

on:
  push:
    branches: [main, v7]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime dirs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path projects, data, config, demo_kit | Out-Null
          New-Item -ItemType Directory -Force -Path projects/project_demo | Out-Null

      - name: Init SQLite + demo project
        shell: pwsh
        env:
          PBC_SKIP_AI_INIT: '1'
        run: |
          python -c "from app.core.db import init_db; init_db(); print('init_db OK')"

      - name: Start backend (background)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "python" -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8111","--log-level","warning" -PassThru -WindowStyle Hidden
          $proc.Id | Out-File -FilePath server.pid
          Write-Host "Backend started, PID=$($proc.Id)"

      - name: Wait for server ready
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8111/health" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "Server ready"; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { Write-Error "Server not ready in 120s"; exit 1 }

      - name: Run regression tests (v7, 16 项)
        shell: pwsh
        env:
          PBC_TEST_BASE: http://127.0.0.1:8111
          PBC_SKIP_AI_INIT: '1'
        run: |
          python scripts/regression_v7.py
          if ($LASTEXITCODE -ne 0) { Write-Error "Regression tests failed"; exit 1 }

      - name: JS syntax check
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('app/static/index.html','utf8');const m=html.match(/<script>([\s\S]*?)<\/script>/g)||[];let all='';for(const s of m){const c=s.replace(/^<script>/,'').replace(/<\/script>$/,'');if(c.includes('src='))continue;all+='\n;\n'+c;}try{new Function(all);console.log('JS OK',all.length,'chars');}catch(e){console.error('JS ERR:',e.message);process.exit(1);}"

      - name: Stop backend
        if: always()
        shell: pwsh
        run: |
          if (Test-Path server.pid) {
            $pid = Get-Content server.pid
            Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue
          }

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            *.log
